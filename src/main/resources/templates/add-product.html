
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | StockFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#17345d;">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">StockFlow</a>
        <a class="btn btn-outline-light" th:href="@{/}">Back to Home</a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <h1 class="fw-bold mb-2">Add New Product</h1>

                    <p class="text-muted mb-4">
                        Enter the product details below to add a
                        new item to StockFlow.
                    </p>

                    <form th:action="@{/products/save}"
                          th:object="${product}"
                          method="post">

                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Product Name
                            </label>
                            <input type="text" id="name"
                                   th:field="*{name}"
                                   class="form-control"
                                   placeholder="Enter product name"
                                   required maxlength="120">
                        </div>

                        <div class="mb-3">
                            <label for="sku" class="form-label">
                                SKU
                            </label>
                            <input type="text" id="sku"
                                   th:field="*{sku}"
                                   class="form-control"
                                   placeholder="Example: STK-1001"
                                   required maxlength="30">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">
                                Description
                            </label>
                            <textarea id="description"
                                      th:field="*{description}"
                                      class="form-control"
                                      rows="3"
                                      maxlength="500"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="unitPrice" class="form-label">
                                Unit Price ($)
                            </label>
                            <input type="number" id="unitPrice"
                                   th:field="*{unitPrice}"
                                   class="form-control"
                                   min="0.01" step="0.01"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="brandId" class="form-label">
                                Brand ID
                            </label>
                            <input type="number" id="brandId"
                                   th:field="*{brandId}"
                                   class="form-control"
                                   min="1" required>
                        </div>

                        <div class="mb-4">
                            <label for="categoryId" class="form-label">
                                Category ID
                            </label>
                            <input type="number" id="categoryId"
                                   th:field="*{categoryId}"
                                   class="form-control"
                                   min="1" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-primary">
                                Save Product
                            </button>

                            <a th:href="@{/}" class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
