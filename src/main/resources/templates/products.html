
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | StockFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#17345d;">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            StockFlow
        </a>
        <a class="btn btn-outline-light" th:href="@{/}">
            Back to Home
        </a>
    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold">Product Management</h1>
            <p class="text-muted">
                Manage your StockFlow inventory.
            </p>
        </div>

        <a th:href="@{/products/new}" class="btn btn-primary">
            + Add Product
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">

            <h4 class="fw-bold mb-3">All Products</h4>

            <div class="table-responsive">
                <table class="table table-hover align-middle">

                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>SKU</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Brand ID</th>
                            <th>Category ID</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        <!-- Display all products -->
                        <tr th:each="product : ${products}">

                            <td th:text="${product.id}"></td>

                            <td th:text="${product.name}"></td>

                            <td th:text="${product.sku}"></td>

                            <td th:text="${product.description}"></td>

                            <td th:text="${product.unitPrice}"></td>

                            <td th:text="${product.brandId}"></td>

                            <td th:text="${product.categoryId}"></td>

                            <!-- Edit and Delete Buttons -->
                            <td>
                                <div class="d-flex gap-2">

                                    <!-- Edit Product -->
                                    <a th:href="@{/products/edit/{id}(id=${product.id})}"
                                       class="btn btn-warning btn-sm">
                                        Edit
                                    </a>

                                    <!-- Delete Product -->
                                    <form th:action="@{/products/delete/{id}(id=${product.id})}"
                                          method="post"
                                          onsubmit="return confirm('Are you sure you want to delete this product?');">

                                        <button type="submit"
                                                class="btn btn-danger btn-sm">
                                            Delete
                                        </button>

                                    </form>

                                </div>
                            </td>

                        </tr>

                        <!-- Display message if no products exist -->
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="8"
                                class="text-center text-muted py-4">
                                No products found. Add your first product!
                            </td>
                        </tr>

                    </tbody>

                </table>
            </div>

        </div>
    </div>

</main>

</body>
</html>
