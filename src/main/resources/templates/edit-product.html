
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Edit Product | StockFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#17345d;">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            StockFlow
        </a>
        <a class="btn btn-outline-light" th:href="@{/products}">
            Back to Products
        </a>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">

                    <h1 class="fw-bold mb-2">Edit Product</h1>
                    <p class="text-muted mb-4">
                        Update the product information below.
                    </p>

                    <form th:action="@{/products/save}"
                          th:object="${product}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">SKU</label>
                            <input type="text"
                                   th:field="*{sku}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}"
                                      class="form-control"
                                      rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Unit Price ($)</label>
                            <input type="number"
                                   th:field="*{unitPrice}"
                                   class="form-control"
                                   min="0.01"
                                   step="0.01"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Brand ID</label>
                            <input type="number"
                                   th:field="*{brandId}"
                                   class="form-control"
                                   min="1"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Category ID</label>
                            <input type="number"
                                   th:field="*{categoryId}"
                                   class="form-control"
                                   min="1"
                                   required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-primary">
                                Update Product
                            </button>

                            <a th:href="@{/products}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
